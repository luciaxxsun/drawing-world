<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>画出来的世界</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2396c85e'/%3E%3Cpath d='M8 24 L22 8 l4 4 L12 26 z' fill='%23f2cf4a' stroke='%233b3730'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
  :root{
    --paper:#fbf7ee; --ink:#3b3730; --soft:#7d7668; --accent:#e0603c; --card:#fffdf7;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#5f7a45;
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;color:var(--ink)}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas#cv{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
  #ui{position:absolute;pointer-events:none}
  #hud{position:absolute;left:10px;top:8px;display:flex;gap:9px;align-items:center;font-size:14px;
    background:rgba(255,253,247,.9);border:2px solid #cfc6b0;border-radius:10px;padding:5px 10px;
    box-shadow:0 2px 0 #cfc6b0}
  #hud b{color:var(--accent)}
  #bar{width:64px;height:8px;border-radius:5px;background:#e2dccd;overflow:hidden}
  #barIn{height:100%;width:0;background:#4c9a4a;transition:width .25s}
  #tools{position:absolute;right:8px;top:8px;display:flex;gap:6px;pointer-events:auto}
  .tbtn{width:40px;height:40px;border-radius:10px;border:2px solid #cfc6b0;background:rgba(255,253,247,.92);
    font-size:19px;display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 2px 0 #cfc6b0;user-select:none}
  .tbtn.wide{width:54px;font-size:14px;letter-spacing:1px}
  .tbtn:active{transform:translateY(2px);box-shadow:none}
  #miniWrap{position:absolute;right:8px;top:56px;border:2px solid #cfc6b0;border-radius:8px;
    background:rgba(255,253,247,.9);padding:3px;pointer-events:auto;box-shadow:0 2px 0 #cfc6b0}
  #mini{display:block;image-rendering:pixelated;border-radius:5px;cursor:crosshair}
  #hint{position:absolute;left:50%;top:64px;transform:translateX(-50%);font-size:14px;
    background:rgba(59,55,48,.88);color:#fff;padding:6px 14px;border-radius:20px;opacity:0;
    transition:opacity .2s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
  #hint.show{opacity:1}
  #pad{position:absolute;left:0;right:0;bottom:0;height:0;pointer-events:none;display:none}
  .pbtn{position:absolute;width:62px;height:62px;border-radius:50%;background:rgba(255,253,247,.72);
    border:2px solid #cfc6b0;font-size:24px;display:flex;align-items:center;justify-content:center;
    pointer-events:auto;user-select:none;color:#5a5449}
  #pu{left:80px;bottom:86px} #pd{left:80px;bottom:14px}
  #pl{left:14px;bottom:50px} #pr{left:146px;bottom:50px}
  #pe{right:22px;bottom:50px;font-size:20px}
  #modal{position:fixed;inset:0;background:rgba(40,36,30,.55);display:none;align-items:center;
    justify-content:center;padding:12px;z-index:20}
  #modal.show{display:flex}
  #card{background:var(--card);border-radius:18px;border:3px solid #cfc6b0;box-shadow:0 8px 0 #b9ae94;
    padding:16px;width:min(96vw,560px);max-height:92vh;overflow:auto;text-align:center}
  #card h2{margin:.1em 0 .35em;font-size:21px}
  #card p.sub{margin:.2em 0 .7em;color:var(--soft);font-size:14px;line-height:1.55}
  #card button{font:inherit;font-size:15px;padding:9px 18px;border-radius:11px;border:2px solid #b9ae94;
    background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 #b9ae94;margin:4px}
  #card button.main{background:var(--accent);color:#fff;border-color:#b64a2b;box-shadow:0 3px 0 #b64a2b}
  #card button:active{transform:translateY(2px);box-shadow:none}
  .btnrow{position:sticky;bottom:-2px;background:var(--card);padding:6px 0 2px;margin-top:2px}
  #drawWrap{display:flex;flex-direction:column;align-items:center;gap:10px}
  #padCanvas{border:3px solid #b9ae94;border-radius:8px;background:#fff;touch-action:none;
    image-rendering:pixelated;cursor:crosshair}
  #palette{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:420px}
  .sw{width:28px;height:28px;border-radius:8px;border:2px solid #b9ae94;cursor:pointer}
  #card.compact .sw{width:23px;height:23px;border-width:1px;border-radius:6px}
  #card.compact #palette{gap:4px;max-width:min(94vw,420px)}
  #card.compact .sz{width:30px;height:26px}
  #card.compact #drawWrap{gap:7px}
  #card.compact .btnrow{padding-top:4px;margin-top:0}
  .sw.on{outline:3px solid #3b3730;outline-offset:1px}
  .sw.lock{opacity:.16;cursor:not-allowed}
  #sizes{display:flex;gap:6px}
  .sz{width:34px;height:30px;border-radius:8px;border:2px solid #b9ae94;background:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center}
  .sz.on{background:#3b3730}
  .sz i{display:block;background:#3b3730;border-radius:2px}
  .sz.on i{background:#fff}
  #book{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:9px;margin-top:6px}
  .bk{border:2px solid #e0d8c6;border-radius:10px;padding:6px;background:#fff}
  .bk img{width:100%;aspect-ratio:1/1;object-fit:contain;image-rendering:pixelated;display:block;
    border-radius:4px;background:#fdfcf8}
  .bk span{display:block;font-size:12px;margin-top:4px;color:#5a5449;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bk.empty{background:#f3eee2;border-style:dashed}
  #card.compact{padding:10px}
  #card.compact h2{font-size:18px;margin:0 0 .2em}
  #card.compact p.sub{display:none}
  #card.compact button{padding:7px 14px;font-size:14px}
  #rot{position:fixed;inset:0;background:#2b2822;color:#fff;display:none;align-items:center;
    justify-content:center;font-size:18px;z-index:50;text-align:center;padding:30px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="ui">
    <div id="hud">
      <span>图鉴 <b id="hBook">0</b>/20</span>
      <span>画笔 <b id="hBrush">Lv1</b></span>
      <div id="bar"><div id="barIn"></div></div>
    </div>
    <div id="tools">
      <div class="tbtn wide" id="btnBook" title="图鉴">图鉴</div>
      <div class="tbtn" id="btnHelp" title="怎么玩">？</div>
      <div class="tbtn" id="btnFull" title="全屏">⛶</div>
    </div>
    <div id="miniWrap"><canvas id="mini" width="150" height="104"></canvas></div>
    <div id="hint"></div>
    <div id="pad">
      <div class="pbtn" id="pl">◀</div><div class="pbtn" id="pr">▶</div>
      <div class="pbtn" id="pu">▲</div><div class="pbtn" id="pd">▼</div>
      <div class="pbtn" id="pe">画</div>
    </div>
  </div>
</div>
<div id="modal"><div id="card"></div></div>
<div id="rot">把手机横过来玩更好 ♪</div>

<script>
/* ============================================================
   画出来的世界 —— 一大片空地，你走到哪儿画到哪儿，画出来就长在那儿
   ============================================================ */

const CFG = {
  VIEW_W: 440, VIEW_H: 240,
  WORLD_W: 2400, WORLD_H: 1600,   // 大地图有多大（游戏像素）
  CELL: 3,                        // 画板一格 = 世界里 3 像素（24 格 = 72px）
  BOARD: 24,
  SPEED: 92,                      // 小动物走多快
  PW: 13, PH: 9                   // 它的碰撞块
};

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const ui = document.getElementById('ui');
const hintEl = document.getElementById('hint');
const modalEl = document.getElementById('modal');
const cardEl = document.getElementById('card');
const miniCv = document.getElementById('mini');
const miniCtx = miniCv.getContext('2d');

const PAL = [
  '#ffffff', '#3b3730', '#e0603c', '#ef9f3a', '#f2cf4a', '#6fbf5a',
  '#4a8fd8', '#9a6cd0', '#e57aa8', '#f7f3e8', '#c8bda6', '#8b6b4a',
  '#5ad0c8', '#ffd166', '#ff6b6b', '#7cf29a'
];
const BRUSH_LEVELS = [
  {lv:1, name:'铅笔',   colors:4,  sizes:[1],     hint:'黑、红、橙、黄，四种颜色随便画'},
  {lv:2, name:'蜡笔',   colors:9,  sizes:[1,2],   hint:'多了 5 种颜色，还能画粗一点'},
  {lv:3, name:'水彩',   colors:13, sizes:[1,2,3], hint:'颜色几乎全开，还有最粗的笔'},
  {lv:4, name:'荧光笔', colors:16, sizes:[1,2,3], hint:'16 种颜色全开'},
  {lv:5, name:'彩虹笔', colors:16, sizes:[1,2,3], hint:'画着画着自己变颜色'}
];
const UNLOCK_AT = [5, 10, 15, 20];

/* ---------------- 世界：一片草地 + 高高低低的小山 ---------------- */
let terrain = null;          // 预渲染的地面
let miniBase = null;         // 小地图底图
function buildTerrain(){
  terrain = document.createElement('canvas');
  terrain.width = CFG.WORLD_W; terrain.height = CFG.WORLD_H;
  const g = terrain.getContext('2d');
  let seed = 20261116;
  const rnd = ()=>{ seed = (seed*1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };

  // 底色：草地
  g.fillStyle = '#92c056'; g.fillRect(0,0,CFG.WORLD_W,CFG.WORLD_H);
  // 草皮斑块（大块深浅，不要噪点感）
  for(let i=0;i<340;i++){
    const x = rnd()*CFG.WORLD_W, y = rnd()*CFG.WORLD_H, r = 16 + rnd()*54;
    g.fillStyle = rnd() < 0.5 ? 'rgba(126,175,74,.5)' : 'rgba(165,206,112,.45)';
    g.beginPath(); g.ellipse(x,y,r,r*0.6,rnd()*3,0,Math.PI*2); g.fill();
  }

  // 小山：一层层往左上偏，右下留出阴影 = 看起来是鼓起来的
  // 先留几块平地（将来盖房子的地方），平地只是更亮更平整的草
  for(let i=0;i<14;i++){
    const x = rnd()*CFG.WORLD_W, y = rnd()*CFG.WORLD_H, r = 90 + rnd()*70;
    g.fillStyle = 'rgba(190,222,132,.55)';
    g.beginPath(); g.ellipse(x,y,r,r*0.62,rnd()*3,0,Math.PI*2); g.fill();
    g.fillStyle = 'rgba(206,232,156,.45)';
    g.beginPath(); g.ellipse(x-6,y-6,r*0.72,r*0.44,rnd()*3,0,Math.PI*2); g.fill();
  }
  const hills = [];
  for(let i=0;i<58;i++){
    const big = rnd() < 0.32;
    hills.push({
      x: 90 + rnd()*(CFG.WORLD_W-180),
      y: 90 + rnd()*(CFG.WORLD_H-180),
      r: big ? 130 + rnd()*90 : 34 + rnd()*54,
      sq: 0.58 + rnd()*0.26,
      rot: (rnd()-0.5)*0.9
    });
  }
  hills.sort((a,b)=> a.y - b.y);
  const blob = (h, r, dx, dy, color, squash)=>{
    g.fillStyle = color;
    g.beginPath();
    for(let k=0;k<5;k++){
      const a = k/5*Math.PI*2;
      const rr = r*(0.86 + ((k*37)%10)/32);
      g.ellipse(h.x + dx + Math.cos(a)*r*0.42, h.y + dy + Math.sin(a)*r*0.30,
                rr*0.72, rr*0.72*(squash||h.sq), h.rot, 0, Math.PI*2);
    }
    g.fill();
  };
  for(const h of hills){
    blob(h, h.r*1.01, 4, 6, '#86b34c');       // 山脚阴影（只露一圈）
    blob(h, h.r*0.98, 0, 0, '#aad676');       // 山体（比草地亮 = 被太阳照着）
    blob(h, h.r*0.72, -3, -4, '#b8e084');     // 山坡受光
    blob(h, h.r*0.40, -5, -7, '#c8ea97');     // 山顶最亮
    // 山顶一点点高光
    g.fillStyle = 'rgba(255,255,255,.16)';
    g.beginPath();
    g.ellipse(h.x - h.r*0.22, h.y - h.r*0.28, h.r*0.22, h.r*0.13, h.rot, 0, Math.PI*2);
    g.fill();
  }

  // 草丛（竖着的小芽，不是圆点）
  for(let i=0;i<2600;i++){
    const x = rnd()*CFG.WORLD_W, y = rnd()*CFG.WORLD_H;
    const dark = rnd() < 0.45;
    g.fillStyle = dark ? 'rgba(110,160,70,.75)' : 'rgba(190,225,140,.75)';
    g.fillRect(x|0, y|0, 1, 2 + (rnd()*2|0));
    if(rnd() < 0.45) g.fillRect((x|0)+2, (y|0)+1, 1, 2);
  }
  // 小花
  for(let i=0;i<150;i++){
    const x = rnd()*CFG.WORLD_W, y = rnd()*CFG.WORLD_H;
    g.fillStyle = ['#fff9e8','#ffe07a','#ffd1e3','#d8e9ff'][rnd()*4|0];
    g.fillRect(x|0, y|0, 2, 2);
    g.fillStyle = 'rgba(110,160,70,.6)';
    g.fillRect((x|0), (y|0)+2, 1, 1);
  }
  // 小石头
  for(let i=0;i<60;i++){
    const x = rnd()*CFG.WORLD_W, y = rnd()*CFG.WORLD_H, w = 3 + (rnd()*4|0);
    g.fillStyle = 'rgba(120,130,110,.45)';
    g.fillRect(x|0, y|0, w, Math.max(2, w-1));
  }
  // 画框边
  g.strokeStyle = 'rgba(90,125,60,.55)'; g.lineWidth = 8;
  g.strokeRect(4,4,CFG.WORLD_W-8,CFG.WORLD_H-8);

  // 小地图底图
  miniBase = document.createElement('canvas');
  miniBase.width = miniCv.width; miniBase.height = miniCv.height;
  miniBase.getContext('2d').drawImage(terrain, 0, 0, miniBase.width, miniBase.height);
}

/* ---------------- 小动物（猫） ---------------- */
const cat = {x: CFG.WORLD_W/2, y: CFG.WORLD_H/2, vx:0, vy:0, face:1, walk:0, moving:false,
             blink:0, blinkT:1.4, tail:0};

/* ---------------- 画出来的东西 ---------------- */
let pieces = [];     // {cells, bbox, wx, wy, art, block:{x,y,w,h}}
let book = [];
let brushLv = 1;
let camX = 0, camY = 0;
let mode = 'play';
let titleOpen = false;
let hintT = 0;
let worldTime = 0;
const held = {left:false, right:false, up:false, down:false};
const keys = {};
let lastPiece = null, lastPieceT = 0;

/* ---------------- 存档 ---------------- */
const SAVE_KEY = 'drawingworld.v2';
function persist(){
  try{
    const o = {
      pieces: pieces.map(p=>({x:Math.round(p.wx), y:Math.round(p.wy), c:Array.from(p.cells).join('')})),
      book: book.map(b=>({name:b.name, art:b.art, sig:b.sig})),
      lv: brushLv, cx: Math.round(cat.x), cy: Math.round(cat.y)
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(o));
  }catch(e){}
}
function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return;
    const o = JSON.parse(raw);
    if(Array.isArray(o.pieces)) pieces = o.pieces.map(p=>pieceFromCells(p.c, p.x, p.y)).filter(Boolean);
    if(Array.isArray(o.book)) book = o.book;
    if(o.lv) brushLv = o.lv;
    if(typeof o.cx === 'number'){ cat.x = o.cx; cat.y = o.cy; }
  }catch(e){}
}

function bboxOf(cells){
  let x0=99,x1=-1,y0=99,y1=-1,n=0;
  for(let y=0;y<CFG.BOARD;y++) for(let x=0;x<CFG.BOARD;x++){
    if(cells[y*CFG.BOARD+x]){ n++; if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  }
  if(!n) return null;
  return {x0,y0,x1,y1,w:x1-x0+1,h:y1-y0+1,n};
}
function makePiece(cells, bbox, wx, wy){
  const off = document.createElement('canvas');
  off.width = CFG.BOARD; off.height = CFG.BOARD;
  const c = off.getContext('2d');
  for(let y=0;y<CFG.BOARD;y++) for(let x=0;x<CFG.BOARD;x++){
    const v = cells[y*CFG.BOARD+x];
    if(!v) continue;
    c.fillStyle = PAL[v] || '#3b3730';
    c.fillRect(x,y,1,1);
  }
  // 影子：按图画自己的形状做一张暗色版
  const sh = document.createElement('canvas');
  sh.width = CFG.BOARD; sh.height = CFG.BOARD;
  const sc = sh.getContext('2d');
  sc.drawImage(off, 0, 0);
  sc.globalCompositeOperation = 'source-in';
  sc.fillStyle = '#2f4a22';
  sc.fillRect(0, 0, CFG.BOARD, CFG.BOARD);
  const wpx = bbox.w*CFG.CELL, hpx = bbox.h*CFG.CELL;
  const baseY = wy + (bbox.y0 + bbox.h)*CFG.CELL;
  // 站不住的地方：只有下半截挡路（上半截可以走到它后面）
  const block = {x: wx + bbox.x0*CFG.CELL + 1, y: baseY - Math.max(6, hpx*0.42),
                 w: wpx - 2, h: Math.max(6, hpx*0.42)};
  return {cells, bbox, wx: Math.round(wx), wy: Math.round(wy), art: off, shadow: sh, block, baseY};
}
function pieceFromCells(str, wx, wy){
  if(typeof str !== 'string' || str.length !== CFG.BOARD*CFG.BOARD) return null;
  const cells = new Uint8Array(CFG.BOARD*CFG.BOARD);
  for(let i=0;i<cells.length;i++) cells[i] = parseInt(str[i], 36) || 0;
  const bbox = bboxOf(cells);
  if(!bbox) return null;
  return makePiece(cells, bbox, wx, wy);
}

/* ---------------- 声音 ---------------- */
const SFX_FILES = {stamp:'assets/sfx/stamp.wav', draw:'assets/sfx/draw.wav',
                   unlock:'assets/sfx/unlock.wav', page:'assets/sfx/page.wav'};
const samples = {};
function loadSfx(){
  for(const k in SFX_FILES){
    try{ const a = new Audio(SFX_FILES[k]); a.preload='auto'; a.volume=0.45; samples[k]=a; }catch(e){}
  }
}
function playSfx(k){
  const a = samples[k];
  if(!a) return false;
  try{ a.currentTime = 0; const pr = a.play(); if(pr && pr.catch) pr.catch(()=>{}); return true; }catch(e){ return false; }
}
let AC = null;
function beep(freq, dur, type, vol){
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type||'square'; o.frequency.value = freq;
    g.gain.value = vol||0.04;
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + (dur||0.09));
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + (dur||0.09));
  }catch(e){}
}
const SFX = {
  step: ()=>beep(320 + Math.random()*80, 0.03, 'square', 0.012),
  stamp: ()=>{ if(!playSfx('stamp')){ beep(520,0.09,'triangle',0.05); setTimeout(()=>beep(780,0.12,'triangle',0.045),80); } },
  pen: ()=>{ if(!playSfx('draw')) beep(900,0.02,'sine',0.012); },
  book: ()=>{ playSfx('page'); },
  unlock: ()=>{ if(!playSfx('unlock')) [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,0.13,'triangle',0.05), i*95)); },
  undo: ()=>beep(200,0.12,'sawtooth',0.035)
};

function toast(msg, sec){
  hintEl.textContent = msg;
  hintEl.classList.add('show');
  hintT = sec || 2.6;
}

/* ---------------- 缩放 ---------------- */
let scale = 2;
let IS_TOUCH = ('ontouchstart' in window) || ((navigator.maxTouchPoints||0) > 0);
function resize(){
  const rot = document.getElementById('rot');
  if(rot) rot.style.display = (IS_TOUCH && innerHeight > innerWidth*1.15) ? 'flex' : 'none';
  const ratio = innerWidth / Math.max(1, innerHeight);
  let vh = CFG.VIEW_H;
  let vw = Math.round(vh * ratio / 2) * 2;
  vw = Math.max(360, Math.min(vw, CFG.WORLD_W));
  CFG.VW = vw; CFG.VH = vh;
  cv.width = vw; cv.height = vh;
  ctx.imageSmoothingEnabled = false;
  const s = Math.min(innerWidth / vw, innerHeight / vh);
  scale = Math.max(0.9, Math.floor(s*40)/40);
  const cw = Math.round(vw*scale), ch = Math.round(vh*scale);
  cv.style.width = cw+'px'; cv.style.height = ch+'px';
  ui.style.width = cw+'px'; ui.style.height = ch+'px';
  ui.style.position = 'absolute';
  ui.style.left = Math.round((innerWidth-cw)/2)+'px';
  ui.style.top = Math.round((innerHeight-ch)/2)+'px';
  const pad = document.getElementById('pad');
  if(pad) pad.style.display = IS_TOUCH ? 'block' : 'none';
}
window.addEventListener('resize', resize);
// 有的浏览器一开始不上报触摸能力，第一次触摸时再确认一遍
window.addEventListener('touchstart', ()=>{

/* ---------------- 碰撞 ---------------- */
function boxHitsRect(bx, by, bw, bh, r){
  return bx < r.x + r.w && bx + bw > r.x && by < r.y + r.h && by + bh > r.y;
}
function blocked(nx, ny){
  const bx = nx - CFG.PW/2, by = ny - CFG.PH;
  if(bx < 4 || by < 4 || bx + CFG.PW > CFG.WORLD_W-4 || by + CFG.PH > CFG.WORLD_H-4) return true;
  for(const p of pieces) if(boxHitsRect(bx, by, CFG.PW, CFG.PH, p.block)) return true;
  return false;
}

/* ---------------- 更新 ---------------- */
function update(dt){
  worldTime += dt;
  let dx = 0, dy = 0;
  if(held.left || keys['arrowleft'] || keys['a']) dx -= 1;
  if(held.right || keys['arrowright'] || keys['d']) dx += 1;
  if(held.up || keys['arrowup'] || keys['w']) dy -= 1;
  if(held.down || keys['arrowdown'] || keys['s']) dy += 1;
  const len = Math.hypot(dx, dy) || 1;
  const vx = dx/len*CFG.SPEED, vy = dy/len*CFG.SPEED*(dy!==0 && dx!==0 ? 0.85 : 1);
  cat.moving = (dx !== 0 || dy !== 0);
  if(dx !== 0) cat.face = dx > 0 ? 1 : -1;

  // 分两轴走，卡墙也能贴着滑
  const nx = cat.x + vx*dt;
  if(!blocked(nx, cat.y)) cat.x = nx;
  const ny = cat.y + vy*dt;
  if(!blocked(cat.x, ny)) cat.y = ny;

  cat.vx = vx; cat.vy = vy;
  if(cat.moving){
    cat.walk += dt*9;
    cat.tail += dt*7;
    if(Math.random() < dt*6) SFX.step();
  }else{
    cat.walk *= 0.9;
    cat.tail += dt*2.2;
  }
  cat.blinkT -= dt;
  if(cat.blinkT <= 0){ cat.blink = 0.12; cat.blinkT = 1.5 + Math.random()*2.6; }
  if(cat.blink > 0) cat.blink -= dt;

  // 相机
  const tx = Math.max(0, Math.min(CFG.WORLD_W - CFG.VW, cat.x - CFG.VW/2));
  const ty = Math.max(0, Math.min(CFG.WORLD_H - CFG.VH, cat.y - CFG.VH/2));
  camX += (tx - camX) * Math.min(1, dt*8);
  camY += (ty - camY) * Math.min(1, dt*8);

  if(hintT > 0){ hintT -= dt; if(hintT <= 0) hintEl.classList.remove('show'); }
  if(lastPieceT > 0) lastPieceT -= dt;
  updateHud();
}

let lastHud = '';
function updateHud(){
  const next = UNLOCK_AT.find(v => book.length < v);
  const s = book.length + '|' + brushLv + '|' + (next||0);
  if(s === lastHud) return;
  lastHud = s;
  document.getElementById('hBook').textContent = book.length;
  document.getElementById('hBrush').textContent = 'Lv' + brushLv;
  const bar = document.getElementById('barIn');
  if(next){
    const prev = UNLOCK_AT[UNLOCK_AT.indexOf(next)-1] || 0;
    bar.style.width = Math.round((book.length-prev)/(next-prev)*100) + '%';
  }else bar.style.width = '100%';
}

/* ---------------- 渲染 ---------------- */
function render(){
  const VW = CFG.VW, VH = CFG.VH;
  ctx.fillStyle = '#96c85e';
  ctx.fillRect(0,0,VW,VH);
  ctx.save();
  ctx.translate(-Math.round(camX), -Math.round(camY));

  if(terrain) ctx.drawImage(terrain, 0, 0);

  // 按脚下位置排序，谁在下面谁后画
  const list = [];
  for(const p of pieces) list.push({y: p.baseY, kind:'piece', o:p});
  list.push({y: cat.y, kind:'cat'});
  list.sort((a,b)=> a.y - b.y);
  for(const item of list){
    if(item.kind === 'cat') drawCat(ctx, cat.x, cat.y);
    else drawPiece(item.o);
  }
  ctx.restore();

  drawMini();
}

function drawPiece(p){
  const b = p.bbox;
  const x = p.wx + b.x0*CFG.CELL, y = p.wy + b.y0*CFG.CELL;
  // 落地影子（跟着画的形状走，往右下偏一点）
  if(p.shadow){
    ctx.globalAlpha = 0.20;
    ctx.drawImage(p.shadow, p.wx + 5, p.wy + 7, CFG.BOARD*CFG.CELL, CFG.BOARD*CFG.CELL);
    ctx.globalAlpha = 0.14;
    ctx.drawImage(p.shadow, p.wx + 2, p.wy + 3, CFG.BOARD*CFG.CELL, CFG.BOARD*CFG.CELL);
    ctx.globalAlpha = 1;
  }
  ctx.drawImage(p.art, Math.round(p.wx), Math.round(p.wy), CFG.BOARD*CFG.CELL, CFG.BOARD*CFG.CELL);
  if(p === lastPiece && lastPieceT > 0){
    ctx.strokeStyle = 'rgba(224,96,60,' + (0.3 + 0.5*Math.abs(Math.sin(worldTime*8))) + ')';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(x-2, y-2, b.w*CFG.CELL+4, b.h*CFG.CELL+4);
  }
}

/* 小动物：一只橘猫（侧身走路的画法：长身子 + 前头 + 四条腿 + 上翘的尾巴） */
function drawCat(g, x, y){
  const sw = cat.moving ? Math.sin(cat.walk) : 0;          // -1..1 迈步
  const bob = cat.moving ? -Math.abs(sw)*1.2 : Math.sin(worldTime*2.4)*0.5;
  const f = cat.face > 0 ? 1 : -1;
  const K = '#2f2a24', O = '#f2a95c', O2 = '#f7b873', D = '#d98f45', W = '#fbe3bd', P = '#f7a8b8';
  const r = (dx, dy, w, h, c)=>{
    g.fillStyle = c;
    const xx = f > 0 ? (x + dx) : (x - dx - w);
    g.fillRect(Math.round(xx), Math.round(y + dy + bob), w, h);
  };
  const up = Math.max(0, Math.round(sw*1.5)), dn = Math.max(0, Math.round(-sw*1.5));

  g.fillStyle = 'rgba(50,70,35,.22)';
  g.beginPath(); g.ellipse(x + f*1, y + 6, 11, 3, 0, 0, Math.PI*2); g.fill();

  // 尾巴：从屁股连着往上翘
  const tw = Math.round(Math.sin(cat.tail)*1.0);
  r(-10, -6, 3, 6, K);   r(-9, -5, 1, 5, O);
  r(-12, -10 + tw, 3, 5, K); r(-11, -9 + tw, 1, 4, O);
  r(-13, -13 + tw, 2, 4, K); r(-13, -13 + tw, 1, 2, W);

  // 四条腿（走路时交替抬起 1 像素）
  r(-7, 0, 4, 6, K); r(-6, 1, 2, 4 - up, D);
  r(-4, 0, 3, 6, K); r(-3, 1, 1, 4 - dn, D);
  r(1, 0, 4, 6, K);  r(2, 1, 2, 4 - dn, D);
  r(4, 0, 3, 6, K);  r(5, 1, 1, 4 - up, D);

  // 身子
  r(-8, -8, 15, 9, K);
  r(-7, -7, 13, 7, O);
  r(-7, -1, 12, 1, W);
  r(-5, -6, 8, 1, D);
  r(-6, -4, 9, 1, D);

  // 脑袋（压得更低、更圆，跟身子连成一体）
  r(2, -13, 9, 8, K);
  r(3, -12, 7, 6, O2);
  r(3, -13, 7, 1, O2);          // 头顶填平，别凸一块
  // 耳朵（小小的三角）
  r(3, -16, 3, 3, K); r(4, -15, 1, 1, P);
  r(7, -16, 3, 3, K); r(8, -15, 1, 1, P);
  // 眼睛
  r(6, -10, 2, 3, '#fffdf6');
  r(7, -9, 1, 2, K);
  // 鼻子 + 嘴
  r(9, -8, 1, 2, P);
  r(8, -6, 2, 1, K);
  // 胡须
  r(9, -7, 3, 1, 'rgba(47,42,36,.4)');
  // 下巴亮一点
  r(6, -6, 3, 1, W);
}

/* ---------------- 小地图 ---------------- */
function drawMini(){
  const W = miniCv.width, H = miniCv.height;
  if(miniBase) miniCtx.drawImage(miniBase, 0, 0);
  else { miniCtx.fillStyle = '#96c85e'; miniCtx.fillRect(0,0,W,H); }
  const sx = W / CFG.WORLD_W, sy = H / CFG.WORLD_H;
  // 画出来的东西
  for(const p of pieces){
    miniCtx.fillStyle = '#e0603c';
    const w = Math.max(2, p.bbox.w*CFG.CELL*sx), h = Math.max(2, p.bbox.h*CFG.CELL*sy);
    miniCtx.fillRect(p.wx*sx, (p.baseY - h)*sy, w, h);
  }
  // 视野框
  miniCtx.strokeStyle = 'rgba(59,55,48,.5)'; miniCtx.lineWidth = 1;
  miniCtx.strokeRect(camX*sx, camY*sy, CFG.VW*sx, CFG.VH*sy);
  // 小动物的点
  miniCtx.fillStyle = '#fff'; miniCtx.beginPath();
  miniCtx.arc(cat.x*sx, cat.y*sy, 3.6, 0, Math.PI*2); miniCtx.fill();
  miniCtx.fillStyle = '#3b3730'; miniCtx.beginPath();
  miniCtx.arc(cat.x*sx, cat.y*sy, 2.2, 0, Math.PI*2); miniCtx.fill();
}
miniCv.addEventListener('pointerdown', (ev)=>{
  const r = miniCv.getBoundingClientRect();
  const wx = (ev.clientX - r.left) / r.width * CFG.WORLD_W;
  const wy = (ev.clientY - r.top) / r.height * CFG.WORLD_H;
  cat.x = Math.max(20, Math.min(CFG.WORLD_W-20, wx));
  cat.y = Math.max(20, Math.min(CFG.WORLD_H-20, wy));
  camX = Math.max(0, Math.min(CFG.WORLD_W-CFG.VW, cat.x - CFG.VW/2));
  camY = Math.max(0, Math.min(CFG.WORLD_H-CFG.VH, cat.y - CFG.VH/2));
  beep(880, 0.07, 'sine', 0.03);
  toast('跑到这里啦', 1.4);
  persist();
});

/* ---------------- 画板 ---------------- */
let padCv = null, padCtx = null, padCells = null, curColor = 1, curSize = 1, erasing = false;
function openDraw(){
  mode = 'draw';
  padCells = new Uint8Array(CFG.BOARD*CFG.BOARD);
  const compact = innerHeight < 560;
  const headH = compact ? 46 : 118;        // 标题占的高度
  const ctrlH = compact ? 152 : 236;       // 调色板 + 粗细 + 按钮
  const avail = Math.min(innerHeight*0.94 - headH - ctrlH, innerWidth*0.84 - 30);
  const Z = Math.max(4, Math.min(13, Math.floor(avail / CFG.BOARD)));
  const size = CFG.BOARD * Z;
  cardEl.innerHTML =
    '<h2>在这里画点什么</h2>' +
    '<p class="sub">它会长在你脚下这片空地上 —— 房子、树、墙、路灯，画什么都行。</p>' +
    '<div id="drawWrap">' +
      '<canvas id="padCanvas" width="'+size+'" height="'+size+'"></canvas>' +
      '<div id="palette"></div><div id="sizes"></div>' +
      '<div class="btnrow"><button id="dClear">清空</button><button id="dCancel">先不画</button>' +
      '<button class="main" id="dOk">变出来！</button></div>' +
    '</div>';
  cardEl.className = compact ? 'compact' : '';
  modalEl.classList.add('show');
  padCv = document.getElementById('padCanvas');
  padCtx = padCv.getContext('2d');
  padCtx.imageSmoothingEnabled = false;

  const lvl = BRUSH_LEVELS[brushLv-1];
  const palEl = document.getElementById('palette');
  for(let i=1;i<PAL.length;i++){
    const d = document.createElement('div');
    d.className = 'sw' + (i >= lvl.colors ? ' lock' : '') + (i === curColor ? ' on' : '');
    d.style.background = PAL[i];
    d.dataset.i = i;
    if(i < lvl.colors) d.addEventListener('pointerdown', ()=>{
      curColor = i; erasing = false;
      [...palEl.children].forEach(c=>c.classList.toggle('on', +c.dataset.i === i));
    });
    palEl.appendChild(d);
  }
  const szEl = document.getElementById('sizes');
  lvl.sizes.forEach(sz=>{
    const b = document.createElement('div');
    b.className = 'sz' + (sz === curSize ? ' on' : '');
    b.innerHTML = '<i style="width:'+(sz*3)+'px;height:'+(sz*3)+'px"></i>';
    b.addEventListener('pointerdown', ()=>{
      curSize = sz;
      [...szEl.children].forEach((c,k)=>c.classList.toggle('on', lvl.sizes[k] === sz));
    });
    szEl.appendChild(b);
  });
  document.getElementById('dClear').onclick = ()=>{ padCells.fill(0); padRender(); };
  document.getElementById('dCancel').onclick = ()=>{ closeModal(); mode='play'; };
  document.getElementById('dOk').onclick = ()=>stamp();
  padRender();
  bindPad();
}
function padRender(){
  const size = padCv.width / CFG.BOARD;
  padCtx.fillStyle = '#fff';
  padCtx.fillRect(0,0,padCv.width,padCv.height);
  padCtx.fillStyle = '#eef2f7';
  for(let i=1;i<CFG.BOARD;i++){
    padCtx.fillRect(i*size,0,1,padCv.height);
    padCtx.fillRect(0,i*size,padCv.width,1);
  }
  for(let y=0;y<CFG.BOARD;y++) for(let x=0;x<CFG.BOARD;x++){
    const v = padCells[y*CFG.BOARD+x];
    if(!v) continue;
    padCtx.fillStyle = PAL[v];
    padCtx.fillRect(x*size,y*size,size,size);
  }
}
function bindPad(){
  let drawing = false, lastCell = null, rainbow = 0;
  const toCell = (ev)=>{
    const r = padCv.getBoundingClientRect();
    return [Math.max(0,Math.min(CFG.BOARD-1, Math.floor((ev.clientX-r.left)/r.width*CFG.BOARD))),
            Math.max(0,Math.min(CFG.BOARD-1, Math.floor((ev.clientY-r.top)/r.height*CFG.BOARD)))];
  };
  const paintAt = (x,y)=>{
    const lvl = BRUSH_LEVELS[brushLv-1];
    let color = erasing ? 0 : curColor;
    if(brushLv === 5 && !erasing) color = 1 + (rainbow++ % Math.max(1, lvl.colors-1));
    const half = Math.floor((curSize-1)/2);
    for(let dy=-half; dy<=half; dy++) for(let dx=-half; dx<=half; dx++){
      const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=CFG.BOARD||ny>=CFG.BOARD) continue;
      padCells[ny*CFG.BOARD+nx] = color;
    }
  };
  const dot = (x,y)=>{
    if(lastCell && (Math.abs(x-lastCell[0])>1 || Math.abs(y-lastCell[1])>1)){
      const n = Math.max(Math.abs(x-lastCell[0]), Math.abs(y-lastCell[1]));
      for(let i=0;i<=n;i++) paintAt(Math.round(lastCell[0]+(x-lastCell[0])*i/n), Math.round(lastCell[1]+(y-lastCell[1])*i/n));
    }else paintAt(x,y);
    lastCell = [x,y];
  };
  padCv.addEventListener('pointerdown', (ev)=>{
    ev.preventDefault(); padCv.setPointerCapture(ev.pointerId);
    drawing = true; lastCell = null;
    const [x,y] = toCell(ev); dot(x,y); padRender(); SFX.pen();
  });
  padCv.addEventListener('pointermove', (ev)=>{
    if(!drawing) return;
    ev.preventDefault();
    const [x,y] = toCell(ev); dot(x,y); padRender();
  });
  const up = ()=>{ drawing = false; lastCell = null; };
  padCv.addEventListener('pointerup', up);
  padCv.addEventListener('pointercancel', up);
  padCv.addEventListener('contextmenu', (e)=>e.preventDefault());
}

function stamp(){
  const bb = bboxOf(padCells);
  if(!bb){ toast('先画点什么呀', 2); return; }
  // 放在小猫旁边（默认往它面朝的那边放），别压住它
  const wpx = bb.w*CFG.CELL, hpx = bb.h*CFG.CELL;
  const side = cat.face > 0 ? 1 : -1;
  const catBox = {x: cat.x-14, y: cat.y-30, w: 28, h: 32};
  const tryList = [
    [side*46, 6], [-side*46, 6], [0, 52], [side*46, -34], [-side*46, -34], [0, -52]
  ];
  let placed = null;
  for(const [ox, oy] of tryList){
    let wx = Math.round(cat.x + ox - wpx/2);
    let wy = Math.round(cat.y + oy - (bb.y0+bb.h)*CFG.CELL);
    wx = Math.max(6, Math.min(CFG.WORLD_W - wpx - 6, wx));
    wy = Math.max(6, Math.min(CFG.WORLD_H - hpx - 6, wy));
    const cand = makePiece(padCells.slice(), bb, wx, wy);
    const covers = (wx + bb.x0*CFG.CELL) < catBox.x + catBox.w &&
                   (wx + (bb.x1+1)*CFG.CELL) > catBox.x &&
                   (wy + bb.y0*CFG.CELL) < catBox.y + catBox.h &&
                   (wy + (bb.y1+1)*CFG.CELL) > catBox.y;
    pieces.push(cand);
    const stuck = blocked(cat.x, cat.y);
    pieces.pop();
    if(!stuck && !covers){ placed = cand; break; }
  }
  if(!placed){ toast('这里太挤了，先走两步再画吧', 2.4); return; }
  pieces.push(placed);
  lastPiece = placed; lastPieceT = 1.6;
  SFX.stamp();
  applyBook(padCells, bb);
  closeModal(); mode='play';
  persist();
}
function applyBook(cells, bb){
  const sig = Array.from(cells).join('');
  if(book.find(b=>b.sig===sig)){ toast('这个图鉴里已经有啦', 2.2); return; }
  const nm = guessName(cells, bb);
  book.push({name:nm, art:miniArt(cells), sig});
  SFX.book();
  toast('图鉴 +1：' + nm + '（' + book.length + '/20）', 2.8);
  checkUnlock();
}
function miniArt(cells){
  const c = document.createElement('canvas');
  c.width = CFG.BOARD; c.height = CFG.BOARD;
  const g = c.getContext('2d');
  for(let y=0;y<CFG.BOARD;y++) for(let x=0;x<CFG.BOARD;x++){
    const v = cells[y*CFG.BOARD+x];
    if(!v) continue;
    g.fillStyle = PAL[v]; g.fillRect(x,y,1,1);
  }
  try{ return c.toDataURL('image/png'); }catch(e){ return ''; }
}
function guessName(cells, bb){
  const colors = new Set();
  for(const v of cells) if(v) colors.add(v);
  const ratio = bb.w/bb.h, fill = bb.n/(bb.w*bb.h);
  const pick = (a)=>a[Math.floor(Math.random()*a.length)];
  if(colors.size >= 5) return pick(['彩虹','花房子','彩色旗子','糖果店']);
  if(bb.n <= 3) return pick(['一粒豆','小点','花种子']);
  if(ratio > 0.8 && ratio < 1.25 && fill > 0.62) return pick(['小屋','砖房','小方块','面包房']);
  if(bb.h > bb.w*1.4) return pick(['高塔','树','路灯','烟囱','旗杆']);
  if(ratio >= 1.5 && bb.h <= 6) return pick(['墙','篱笆','长椅','田埂']);
  if(fill < 0.25) return pick(['树','花丛','架子','风车']);
  if(bb.w >= 10 && bb.h >= 8) return pick(['小房子','小屋','石头屋','面包房']);
  return pick(['凉亭','小摊','稻草堆','凳子']);
}
function checkUnlock(){
  const want = 1 + UNLOCK_AT.filter(v => book.length >= v).length;
  if(want > brushLv && want <= BRUSH_LEVELS.length){
    brushLv = want;
    const lvl = BRUSH_LEVELS[brushLv-1];
    SFX.unlock();
    setTimeout(()=>{
      openCard('<h2>新画笔：'+lvl.name+'</h2><p class="sub">'+lvl.hint+
        '</p><p class="sub">图鉴里已经有 '+book.length+' 种东西了</p>'+
        '<button class="main" data-act="ok">继续画</button>');
    }, 420);
  }
}

/* ---------------- 图鉴 / 卡片 ---------------- */

  mode = 'book';

  cardEl.className = '';
  let html = '<h2>我的图鉴</h2><p class="sub">画出 '+book.length+' 种东西 · 画笔 '+BRUSH_LEVELS[brushLv-1].name+
    '<br>'+(book.length<20 ? '再画 '+(20-book.length)+' 种就能集满' : '集满啦！')+'</p><div id="book">';
  for(let i=0;i<Math.max(6, book.length);i++){
    const b = book[i];
    if(b) html += '<div class="bk"><img src="'+b.art+'" alt=""><span>'+b.name+'</span></div>';
    else html += '<div class="bk empty"><img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt=""><span>? ?</span></div>';
  }
  html += '</div><div style="margin-top:14px"><button class="main" data-act="close">合上</button></div>';

}
function openCard(inner){
  cardEl.className = '';
  cardEl.innerHTML = inner;
  modalEl.classList.add('show');
  mode = 'card';
}
function closeModal(){ modalEl.classList.remove('show'); cardEl.innerHTML=''; }

/* ---------------- 输入 ---------------- */
window.addEventListener('keydown', (e)=>{
  const k = e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  keys[k] = true;
  if(k === 'f'){ toggleFullscreen(); return; }
  if(titleOpen && !['shift','control','alt','meta','tab'].includes(k)){ startGame(); return; }
  if(mode === 'draw'){ if(k === 'escape'){ closeModal(); mode='play'; } return; }
  if(mode === 'book' || mode === 'card'){
    if(['escape','q','e','enter',' '].includes(k)){ closeModal(); mode='play'; }
    return;
  }
  if(k === 'e'){ openDraw(); return; }
  if(k === 'q' || k === 'tab'){ e.preventDefault(); openBook(); return; }
  if(k === 'x'){ removeNearest(); return; }
});
window.addEventListener('keyup', (e)=>{ keys[e.key.toLowerCase()] = false; });

function removeNearest(){
  let best = null, bd = 1e9;
  for(const p of pieces){
    const d = Math.hypot(p.wx + p.bbox.w*CFG.CELL/2 - cat.x, p.baseY - cat.y);
    if(d < bd){ bd = d; best = p; }
  }
  if(best && bd < 70){
    pieces = pieces.filter(p=>p!==best);
    SFX.undo();
    toast('拆掉啦（图鉴里还留着）', 2);
    persist();
  }else toast('旁边没有可以拆的东西', 1.8);
}

/* ---------------- 触摸 ---------------- */
function bindBtn(el, down, up){
  el.addEventListener('pointerdown', (ev)=>{ ev.preventDefault(); down(); });
  el.addEventListener('pointerup', (ev)=>{ ev.preventDefault(); up && up(); });
  el.addEventListener('pointercancel', ()=>{ up && up(); });
  el.addEventListener('pointerleave', ()=>{ up && up(); });
}
bindBtn(document.getElementById('pl'), ()=>held.left=true, ()=>held.left=false);
bindBtn(document.getElementById('pr'), ()=>held.right=true, ()=>held.right=false);
bindBtn(document.getElementById('pu'), ()=>held.up=true, ()=>held.up=false);
bindBtn(document.getElementById('pd'), ()=>held.down=true, ()=>held.down=false);
bindBtn(document.getElementById('pe'), ()=>{ if(mode==='play') openDraw(); });
document.getElementById('btnBook').onclick = ()=>{ if(mode==='play') openBook(); };
document.getElementById('btnHelp').onclick = showHelp;
document.getElementById('btnFull').onclick = toggleFullscreen;
cardEl.addEventListener('click', (ev)=>{
  const t = ev.target;
  if(t.dataset && (t.dataset.act === 'close' || t.dataset.act === 'ok')){ closeModal(); mode='play'; }
  if(t.dataset && t.dataset.act === 'start'){ startGame(); }
});
function toggleFullscreen(){
  try{
    if(!document.fullscreenElement){
      const pr = document.documentElement.requestFullscreen(); if(pr&&pr.catch) pr.catch(()=>{});
    }else{
      const pr = document.exitFullscreen(); if(pr&&pr.catch) pr.catch(()=>{});
    }
  }catch(e){}
}
function showHelp(){
  openCard('<h2>怎么玩</h2>' +
    '<p class="sub">这是你的一片空地，什么都没有 —— 除了高高低低的小山。<br>走到哪儿，就在哪儿画，把它变成一座小城市。</p>' +
    '<ul style="text-align:left;font-size:15px;line-height:1.9;margin:0 auto 12px;max-width:360px;padding-left:20px">' +
    '<li>方向键 / WASD 走路</li>' +
    '<li><b>E</b> 画画（画完点「变出来」）</li>' +
    '<li><b>Q</b> 图鉴 · <b>X</b> 拆掉旁边的东西</li>' +
    '<li>点右上角小地图，可以直接跑过去</li>' +
    '</ul><p class="sub">画满 5 / 10 / 15 / 20 种，换新画笔 🖌</p>' +
    '<button class="main" data-act="close">知道了</button>');
  mode = 'card';
}
function startGame(){
  titleOpen = false;
  closeModal();
  mode = 'play';
  try{ if(!document.fullscreenElement){ const pr=document.documentElement.requestFullscreen(); if(pr&&pr.catch) pr.catch(()=>{}); } }catch(e){}
  beep(520,0.08,'triangle',0.04);
  setTimeout(()=>beep(720,0.1,'triangle',0.04), 90);
  setTimeout(()=>toast('走到想盖房子的地方，按 E 画', 3.2), 500);
}

/* ---------------- 调试口 ---------------- */
window.__gameforge = {
  state:{scene:'title', x:0, y:0, score:0, deaths:0, wins:0},
  fps:60, events:[],
  controls:{start:['Enter',' '], move:['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'], action:['e']}
};
window.__act = {
  start(){ startGame(); },
  hold(dir, sec){ held[dir]=true; for(let i=0;i<Math.round((sec||0.5)/0.016);i++) update(0.016); held[dir]=false; render(); },
  teleport(x,y){ cat.x=x; cat.y=y; camX=Math.max(0,Math.min(CFG.WORLD_W-CFG.VW,x-CFG.VW/2)); camY=Math.max(0,Math.min(CFG.WORLD_H-CFG.VH,y-CFG.VH/2)); render(); },
  state(){ return {x:Math.round(cat.x), y:Math.round(cat.y), pieces:pieces.length, book:book.length, lv:brushLv}; },
  book(){ return book.map(b=>b.name); },
  line(y, thick, x0, x1){
    const c = new Uint8Array(CFG.BOARD*CFG.BOARD);
    for(let t=0;t<(thick||1);t++) for(let x=(x0||0);x<=(x1===undefined?CFG.BOARD-1:x1);x++) c[(y+t)*CFG.BOARD+x]=2;
    return Array.from(c);
  },
  box(x0,y0,x1,y1,color){
    const c = new Uint8Array(CFG.BOARD*CFG.BOARD);
    for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) c[y*CFG.BOARD+x]=(color||5);
    return Array.from(c);
  },
  draw(cells, x, y){
    padCells = Uint8Array.from(cells);
    const bb = bboxOf(padCells);
    if(!bb) return '空';
    const wx = (x===undefined? cat.x : x) - bb.x0*CFG.CELL;
    const wy = (y===undefined? cat.y+6 : y) - (bb.y0+bb.h)*CFG.CELL;
    const p = makePiece(padCells.slice(), bb, wx, wy);
    pieces.push(p); lastPiece=p; lastPieceT=1.4;
    applyBook(padCells, bb); persist(); render();
    return {wx:Math.round(wx), wy:Math.round(wy), bb};
  },
  clear(){ pieces=[]; book=[]; brushLv=1; persist(); render(); },
  drawUI(){ openDraw(); return true; },
  stampUI(){ stamp(); return true; },
  bookUI(){ openBook(); return true; },
  blocked(x,y){ return blocked(x===undefined?cat.x:x, y===undefined?cat.y:y); }
};

/* ---------------- 启动 ---------------- */
loadSfx();
buildTerrain();
loadSave();
resize();
render();
updateHud();
showTitle();

let last = performance.now(), gF = 0, gT = 0;
function loop(now){
  const dt = Math.min(0.033, (now-last)/1000);
  last = now;
  if(mode === 'play') update(dt);
  render();
  gF++; gT += dt;
  if(gT >= 0.5){ window.__gameforge.fps = Math.round(gF/gT); gF=0; gT=0; }
  const s = window.__gameforge.state;
  s.scene = mode; s.x = Math.round(cat.x); s.y = Math.round(cat.y); s.score = book.length;
  requestAnimationFrame(loop);
}
function showTitle(){
  mode = 'card'; titleOpen = true;
  cardEl.className = '';
  cardEl.innerHTML =
    '<h2>画出来的世界</h2>' +
    '<p class="sub">这是一大片空地，只有高高低低的小山。<br>你带着一只小猫，走到哪儿，就在哪儿画。</p>' +
    '<p class="sub">画出来的东西会真的长在那儿 —— 慢慢把这里变成一座小城市。</p>' +
    '<button class="main" data-act="start">出门看看 ▶</button>' +
    '<p class="sub" style="margin-top:10px;font-size:13px">按任意键也能开始 ♪<br>方向键走路 · E 画画 · Q 图鉴</p>';
  modalEl.classList.add('show');
}
requestAnimationFrame(loop);
</script>
